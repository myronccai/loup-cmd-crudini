# Example application settings
log_level = info
data_dir = /var/lib/app

[database]
host = db.internal   ; primary server
port = 5432
user = app
options = sslmode=require,connect_timeout=10

[server]
listen: 0.0.0.0:8080
workers = 4
plugins = auth, metrics

[mysqld]
skip-name-resolve
max_connections = 200

[motd]
text = Welcome to the system.
    Maintenance window: Sunday 02:00.
